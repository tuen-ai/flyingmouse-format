<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 源码页允许 'self'（直接打开 offline/index.html 调试用）；构建时会换成不含 'self' 的严格策略 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; media-src blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src blob:; form-action 'none'; base-uri 'none'">
    <title>轉檔台 FormatDeck · 離線單檔工具</title>
    <style>
/* 飞鼠格式 · 离线版 UI —— 在鼠鼠品牌（珊瑚红 + 墨线 + 硬阴影）基础上重做的「控制台」布局。
   与桌面版 public/styles.css 的区别：卡片化工作台、chip 式目标选择、深浅双主题、更克制的间距节奏。
   全部离线：不引用任何外部字体、图片或脚本。 */

:root {
  color-scheme: light;
  --bg: #f6f4ef;
  --bg-glow-a: #ffe0e4;
  --bg-glow-b: #dcecff;
  --surface: #fffdf8;
  --surface-raised: #ffffff;
  --surface-sunken: #f2efe8;
  --ink: #141414;
  --muted: #5a5a5a;
  --line: #141414;
  --line-soft: rgba(20, 20, 20, 0.14);
  --accent: #e95f6d;
  --accent-strong: #d94d5d;
  --accent-soft: #ffe0e4;
  --accent-soft-fade: rgba(255, 224, 228, 0);
  --bg-glow-a-fade: rgba(255, 224, 228, 0);
  --bg-glow-b-fade: rgba(220, 236, 255, 0);
  --blue-soft: #dcecff;
  --green-soft: #dff5ee;
  --yellow-soft: #fff2bc;
  --success: #1f8a55;
  --warning: #8a6d00;
  --error: #d93025;
  --shadow-hard: 4px 4px 0 var(--line);
  --shadow-soft: 0 10px 26px rgba(20, 20, 20, 0.09);
  --radius-lg: 20px;
  --radius: 14px;
  --radius-sm: 10px;
  --space: 16px;
  --font-ui: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", "Noto Sans SC", Arial, sans-serif;
  --font-mono: Consolas, "SFMono-Regular", "Courier New", monospace;
}

:root[data-theme='auto'] {
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root[data-theme='auto'] {
    color-scheme: dark;
    --bg: #16161a;
    --bg-glow-a: rgba(233, 95, 109, 0.22);
    --bg-glow-b: rgba(90, 140, 220, 0.18);
    --surface: #1f1f25;
    --surface-raised: #26262e;
    --surface-sunken: #191920;
    --ink: #f3f0ea;
    --muted: #b3aea6;
    --line: #050506;
    --line-soft: rgba(243, 240, 234, 0.16);
    --accent: #f4737f;
    --accent-strong: #ff8b95;
    --accent-soft: rgba(244, 115, 127, 0.2);
    --accent-soft-fade: rgba(244, 115, 127, 0);
    --bg-glow-a-fade: rgba(233, 95, 109, 0);
    --bg-glow-b-fade: rgba(90, 140, 220, 0);
    --blue-soft: rgba(120, 165, 235, 0.22);
    --green-soft: rgba(60, 180, 130, 0.2);
    --yellow-soft: rgba(230, 190, 70, 0.2);
    --success: #56d19a;
    --error: #ff7a70;
    --shadow-hard: 4px 4px 0 #050506;
    --shadow-soft: 0 14px 30px rgba(0, 0, 0, 0.45);
  }
}

:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #16161a;
  --bg-glow-a: rgba(233, 95, 109, 0.22);
  --bg-glow-b: rgba(90, 140, 220, 0.18);
  --surface: #1f1f25;
  --surface-raised: #26262e;
  --surface-sunken: #191920;
  --ink: #f3f0ea;
  --muted: #b3aea6;
  --line: #050506;
  --line-soft: rgba(243, 240, 234, 0.16);
  --accent: #f4737f;
  --accent-strong: #ff8b95;
  --accent-soft: rgba(244, 115, 127, 0.2);
  --accent-soft-fade: rgba(244, 115, 127, 0);
  --bg-glow-a-fade: rgba(233, 95, 109, 0);
  --bg-glow-b-fade: rgba(90, 140, 220, 0);
  --blue-soft: rgba(120, 165, 235, 0.22);
  --green-soft: rgba(60, 180, 130, 0.2);
  --yellow-soft: rgba(230, 190, 70, 0.2);
  --success: #56d19a;
  --error: #ff7a70;
  --shadow-hard: 4px 4px 0 #050506;
  --shadow-soft: 0 14px 30px rgba(0, 0, 0, 0.45);
}

* {
  box-sizing: border-box;
  min-width: 0;
}

[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(900px 520px at 8% -12%, var(--bg-glow-a), var(--bg-glow-a-fade) 65%),
    radial-gradient(880px 480px at 104% 2%, var(--bg-glow-b), var(--bg-glow-b-fade) 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.6;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -999px;
  top: 8px;
  z-index: 20;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: #ffffff;
  font-weight: 700;
  text-decoration: none;
}

.skip-link:focus {
  left: 12px;
}

button,
select,
input,
a {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button:focus-visible,
select:focus-visible,
input:focus-visible,
a:focus-visible,
li:focus-visible {
  outline: 3px solid #3976d8;
  outline-offset: 3px;
}

.deck {
  width: min(1180px, calc(100vw - 32px));
  margin: 0 auto;
  padding: 26px 0 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ---------- 顶栏 ---------- */

.deck-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 16px 18px;
  border: 2px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-hard);
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.brand-port {
  display: grid;
  place-items: center;
  width: 76px;
  height: 76px;
  flex: none;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: linear-gradient(160deg, var(--accent-soft), var(--surface-raised));
  overflow: hidden;
}

.brand-mark {
  width: 40px;
  height: 40px;
  fill: none;
  stroke: var(--accent-strong);
  stroke-width: 3.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.brand-text {
  min-width: 0;
}

.brand-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.6px;
  color: var(--accent-strong);
  text-transform: uppercase;
}

.chip-offline {
  padding: 2px 8px;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  background: var(--green-soft);
  color: var(--success);
  font-size: 11px;
  letter-spacing: 0;
  text-transform: none;
}

.brand-title {
  margin: 2px 0 2px;
  font-size: clamp(20px, 2.6vw, 27px);
  font-weight: 900;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.brand-sub {
  margin: 0;
  font-size: 12.5px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.deck-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.icon-button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.12s ease;
}

.icon-button:hover {
  background: var(--accent-soft);
  transform: translateY(-1px);
}

.icon-button-glyph {
  font-size: 15px;
}

.select-field {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px 5px 12px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
}

.select-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}

.select-field select {
  border: 0;
  background: transparent;
  font-weight: 700;
  padding: 4px 2px;
  cursor: pointer;
}

/* ---------- 卡片 ---------- */

.deck-main {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.card {
  border: 2px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-hard);
  padding: 18px;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.card-title {
  margin: 0;
  font-size: 17px;
  font-weight: 900;
}

.counter {
  min-width: 26px;
  padding: 1px 8px;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-size: 12px;
  font-weight: 800;
  text-align: center;
}

.card-head-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* ---------- 上传台 ---------- */

.stage-card {
  padding: 0;
  overflow: hidden;
}

.stage-inner {
  display: flex;
  flex-direction: column;
}

.dropzone {
  display: flex;
  align-items: center;
  gap: 22px;
  width: 100%;
  padding: 22px 24px;
  border: 0;
  border-bottom: 2px dashed var(--line-soft);
  background: linear-gradient(150deg, var(--accent-soft), var(--accent-soft-fade) 62%), var(--surface);
  text-align: left;
  cursor: pointer;
  transition: background 0.15s ease, outline-offset 0.15s ease;
}

.dropzone:hover {
  background: linear-gradient(150deg, var(--accent-soft), var(--accent-soft-fade) 45%), var(--surface-raised);
}

.dropzone.dragging {
  outline: 3px dashed var(--accent);
  outline-offset: -12px;
  background: linear-gradient(150deg, var(--accent-soft), var(--yellow-soft));
}

.stage-art {
  display: grid;
  place-items: center;
  width: 132px;
  height: 132px;
  flex: none;
  border: 2px solid var(--line);
  border-radius: 28px;
  background: var(--surface-raised);
  box-shadow: var(--shadow-hard);
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

.stage-glyph {
  width: 60px;
  height: 60px;
  fill: none;
  stroke: var(--accent);
  stroke-width: 3.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.2s ease;
}

.stage-art[data-state='converting'] .stage-glyph,
.stage-art[data-state='batch'] .stage-glyph {
  animation: glyph-spin 2.4s linear infinite;
}

.stage-art[data-state='batch'] .stage-glyph {
  animation: none;
}

.stage-art[data-state='success'] {
  border-color: var(--success);
  background: var(--green-soft);
}

.stage-art[data-state='success'] .stage-glyph {
  stroke: var(--success);
}

.stage-art[data-state='error'] {
  border-color: var(--error);
  background: color-mix(in srgb, var(--error) 12%, var(--surface-raised));
}

.stage-art[data-state='error'] .stage-glyph {
  stroke: var(--error);
}

.dropzone:hover .stage-art,
.dropzone.dragging .stage-art {
  transform: translateY(-3px);
  background: var(--accent-soft);
}

@keyframes glyph-spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.dropzone-text {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.dropzone-title {
  font-size: clamp(21px, 3vw, 31px);
  font-weight: 900;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.dropzone-hint {
  font-size: 13px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.promise-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0;
  padding: 12px 24px 16px;
  list-style: none;
  background: var(--surface-sunken);
}

.promise {
  padding: 4px 10px;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  background: var(--surface-raised);
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}

/* ---------- 工作台 ---------- */

.workbench {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 348px;
  gap: 18px;
  align-items: start;
}

.queue-list,
.result-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.queue-item {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 2px solid var(--line-soft);
  border-radius: var(--radius);
  background: var(--surface-raised);
}

.queue-item.is-success {
  border-color: var(--success);
  background: var(--green-soft);
}

.queue-item.is-error {
  border-color: var(--error);
  background: color-mix(in srgb, var(--error) 12%, transparent);
}

.queue-glyph {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--accent-strong);
  overflow: hidden;
}

.queue-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.queue-body {
  min-width: 0;
}

.queue-name {
  margin: 0;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.queue-meta {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.queue-status {
  margin: 4px 0 0;
  font-size: 12px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.queue-item.is-error .queue-status {
  color: var(--error);
}

.queue-item.is-success .queue-status {
  color: var(--success);
}

.queue-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.queue-empty {
  margin: 0;
  padding: 18px 4px;
  color: var(--muted);
  text-align: center;
}

.queue-progress {
  grid-column: 1 / -1;
  height: 6px;
  border-radius: 999px;
  background: var(--surface-sunken);
  overflow: hidden;
}

.queue-progress-fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), #ffb28a);
  transition: width 0.25s ease;
}

/* ---------- 控制台 ---------- */

.field-block {
  padding: 14px 0;
  border-top: 1px solid var(--line-soft);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.field-block:first-of-type {
  border-top: 0;
  padding-top: 0;
}

.field-label {
  display: block;
  margin: 0;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.3px;
  color: var(--muted);
  text-transform: uppercase;
}

.field-note {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.chip-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.target-chip {
  padding: 8px 14px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--surface-raised);
  font-weight: 800;
  font-size: 13px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
}

.target-chip:hover {
  transform: translateY(-1px);
  background: var(--accent-soft);
}

.target-chip[aria-checked='true'] {
  background: var(--accent);
  color: #ffffff;
  box-shadow: var(--shadow-hard);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field input[type='number'],
.field input[type='text'],
.field select {
  padding: 8px 10px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
}

.field input[type='range'] {
  accent-color: var(--accent);
}

.field-value {
  font-weight: 800;
  color: var(--accent-strong);
}

.switch {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 13px;
  line-height: 1.45;
  cursor: pointer;
}

.switch input {
  margin-top: 3px;
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
  flex: none;
}

.console-actions {
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.primary-button {
  padding: 12px 18px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: #ffffff;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--shadow-hard);
  white-space: normal;
  transition: transform 0.12s ease, background 0.12s ease;
}

.primary-button:hover:not(:disabled) {
  background: var(--accent-strong);
  transform: translateY(-1px);
}

.primary-button:disabled {
  background: var(--surface-sunken);
  color: var(--muted);
  box-shadow: none;
  cursor: not-allowed;
}

.ghost-button {
  padding: 7px 12px;
  border: 2px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  white-space: normal;
  transition: background 0.12s ease, color 0.12s ease;
}

.ghost-button:hover {
  background: var(--accent-soft);
  color: var(--accent-strong);
}

.ghost-button.danger:hover {
  background: color-mix(in srgb, var(--error) 16%, transparent);
  color: var(--error);
}

.mini-button {
  padding: 5px 10px;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  font-size: 12px;
  font-weight: 800;
  color: var(--accent-strong);
  cursor: pointer;
}

.mini-button:hover {
  background: var(--accent);
  color: #ffffff;
}

.status-line {
  margin: 0;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  font-size: 13px;
  color: var(--muted);
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.status-line.is-success {
  background: var(--green-soft);
  color: var(--success);
  font-weight: 700;
}

.status-line.is-error {
  background: color-mix(in srgb, var(--error) 14%, transparent);
  color: var(--error);
  font-weight: 700;
}

/* ---------- 结果 ---------- */

.result-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 2px solid var(--line-soft);
  border-radius: var(--radius);
  background: var(--surface-raised);
}

.result-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.result-name {
  margin: 0;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.result-meta {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
}

/* ---------- 页脚与提示 ---------- */

.deck-foot {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px 18px;
  border: 2px dashed var(--line-soft);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.notice {
  margin: 0;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.notice.muted {
  color: var(--muted);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 30;
  max-width: min(520px, calc(100vw - 32px));
  padding: 12px 18px;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--shadow-hard);
  font-weight: 700;
  overflow-wrap: anywhere;
}

.toast.is-error {
  background: color-mix(in srgb, var(--error) 16%, var(--surface-raised));
  color: var(--error);
}

function decodeXmlEntities(text) {

      const wrapped = new Error("JSON 解析失败：文件内容不是有效的 JSON。");
      wrapped.code = "JSON_PARSE_FAILED";
      wrapped.cause = error;
      throw wrapped;
    }
    const rows = Array.isArray(data) ? data : [data];
    const flattened = rows.map((row) => {
      if (row && typeof row === "object" && !Array.isArray(row)) return flattenRow(row, "", Object.create(null));
      const fallback = Object.create(null);
      fallback.value = Array.isArray(row) ? stableJsonStringify(row) : row;
      return fallback;
    });
    const headers = [...new Set(flattened.flatMap((row) => Object.keys(row)))].sort();
    const lines = [headers.map(quoteCsvField).join(",")];
    for (const row of flattened) {
      lines.push(headers.map((header) => quoteCsvField(row[header] == null ? "" : row[header])).join(","));
    }
    return lines.join("\n");
  }

  function serializeCsv(records, options = {}) {
    const delimiter = options.delimiter || ",";
    const body = records
      .map((record) => record.map((field) => quoteCsvField(field)).join(delimiter))
      .join("\n");
    return options.bom ? `\uFEFF${body}` : body;
  }

  // ---------- 极简 HTML 解析（供 html -> md / txt 使用） ----------

  const VOID_TAGS = new Set(["area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr"]);
  const RAW_TEXT_TAGS = new Set(["script", "style"]);
  const BLOCK_TAGS = new Set(["p", "div", "section", "article", "header", "footer", "main", "aside", "ul", "ol", "li", "table", "thead", "tbody", "tfoot", "tr", "td", "th", "h1", "h2", "h3", "h4", "h5", "h6", "pre", "blockquote", "hr"]);
  // null 原型：否则 "&constructor;" 之类的实体会命中 Object.prototype 上的成员
  const NAMED_ENTITIES = Object.assign(Object.create(null), { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'", nbsp: " " });
  // 嵌套深度上限：畸形/恶意 HTML（几万层嵌套）会让后续递归序列化爆栈，超过这个深度就压平
  const MAX_HTML_DEPTH = 256;
  // 这些标签可以被后面的同级标签隐式关掉（HTML 解析器的 optional end tag 子集）
  const IMPLICIT_CLOSABLE = new Set(["p", "li", "td", "th", "tr", "span", "em", "strong", "b", "i", "code", "a"]);

  function decodeHtmlEntities(text) {
    return String(text).replace(/&(#x?[0-9a-f]+|[a-z]+);/gi, (match, body) => {
      if (body[0] === "#") {
        const isHex = body[1] === "x" || body[1] === "X";
        const point = Number.parseInt(isHex ? body.slice(2) : body.slice(1), isHex ? 16 : 10);
        if (!Number.isFinite(point) || point < 0 || point > 0x10ffff) return match;
        try {
          return String.fromCodePoint(point);
        } catch (error) {
          return match;
        }
      }
      const named = NAMED_ENTITIES[body.toLowerCase()];
      return named === undefined ? match : named;
    });
  }

  function parseAttributes(source) {
    const attributes = {};
    const pattern = /([^\s/>=]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'>]+)))?/g;
    let match = pattern.exec(source);
    while (match) {
      const name = match[1].toLowerCase();
      const value = match[2] !== undefined ? match[2] : match[3] !== undefined ? match[3] : match[4] !== undefined ? match[4] : "";
      attributes[name] = decodeHtmlEntities(value);
      match = pattern.exec(source);
    }
    return attributes;
  }

  function parseHtml(html) {
    const root = { type: "root", children: [] };
    const stack = [root];
    const text = String(html == null ? "" : html);
    let index = 0;
    const top = () => stack[stack.length - 1];
    const pushText = (value) => {
      if (!value) return;
      top().children.push({ type: "text", value: decodeHtmlEntities(value) });
    };
    const closeTag = (tag) => {
      for (let i = stack.length - 1; i > 0; i -= 1) {
        if (stack[i].tag === tag) {
          stack.length = i;
          return;
        }
      }
    };

    while (index < text.length) {
      const next = text.indexOf("<", index);
      if (next === -1) {
        pushText(text.slice(index));
        break;
      }
      pushText(text.slice(index, next));
      if (text.startsWith("<!--", next)) {
        const end = text.indexOf("-->", next + 4);
        index = end === -1 ? text.length : end + 3;
        continue;
      }
      if (text.startsWith("<!", next) || text.startsWith("<?", next)) {
        const end = text.indexOf(">", next);
        index = end === -1 ? text.length : end + 1;
        continue;
      }
      const closeMatch = /^<\/\s*([a-zA-Z][\w:-]*)\s*>/.exec(text.slice(next));
      if (closeMatch) {
        closeTag(closeMatch[1].toLowerCase());
        index = next + closeMatch[0].length;
        continue;
      }
      const openMatch = /^<([a-zA-Z][\w:-]*)((?:[^>"']|"[^"]*"|'[^']*')*?)(\/?)>/.exec(text.slice(next));
      if (!openMatch) {
        pushText("<");
        index = next + 1;
        continue;
      }
      const tag = openMatch[1].toLowerCase();
      const node = { type: "element", tag, attributes: parseAttributes(openMatch[2]), children: [] };
      // 隐式闭合：<li> 遇 <li>、<td>/<th>/<tr> 同级、<p> 遇块级元素。
      // 必须沿栈往下找（真实 HTML 里常见 <li><p>a<li>b，只看直接父节点会把第二个 li 塞进第一个里）。
      const closeImplicit = (targets) => {
        for (let i = stack.length - 1; i > 0; i -= 1) {
          const node = stack[i];
          if (targets.includes(node.tag)) {
            stack.length = i;
            return;
          }
          if (!IMPLICIT_CLOSABLE.has(node.tag)) return;
        }
      };
      if (tag === "li") closeImplicit(["li"]);
      else if (tag === "td" || tag === "th") closeImplicit(["td", "th"]);
      else if (tag === "tr") closeImplicit(["tr"]);
      else if (BLOCK_TAGS.has(tag) && top().type === "element" && top().tag === "p") stack.pop();
      top().children.push(node);
      index = next + openMatch[0].length;

      if (RAW_TEXT_TAGS.has(tag)) {
        const closing = new RegExp(`</${tag}\\s*>`, "i");
        const rest = text.slice(index);
        const match = closing.exec(rest);
        const raw = match ? rest.slice(0, match.index) : rest;
        node.children.push({ type: "text", value: raw });
        index += match ? match.index + match[0].length : rest.length;
        continue;
      }
      if (!VOID_TAGS.has(tag) && !openMatch[3] && stack.length < MAX_HTML_DEPTH) stack.push(node);
    }
    return root;
  }

  function collectText(node) {
    if (node.type === "text") return node.value;
    if (node.type === "element" && RAW_TEXT_TAGS.has(node.tag)) return "";
    return (node.children || []).map(collectText).join("");
  }

  // ---------- HTML -> Markdown ----------

  const SAFE_TABLE_TAGS = new Set(["table", "caption", "thead", "tbody", "tfoot", "tr", "th", "td", "strong", "b", "em", "i", "code", "br", "p", "ul", "ol", "li"]);
  const DROP_TAGS = new Set(["script", "style", "iframe", "object", "embed"]);

  function findElements(node, tag, result = []) {
    for (const child of node.children || []) {
      if (child.type !== "element") continue;
      if (child.tag === tag) result.push(child);
      findElements(child, tag, result);
    }
    return result;
  }

  function isComplexTable(table) {
    if (findElements(table, "table").length > 0) return true;
    const cells = [...findElements(table, "th"), ...findElements(table, "td")];
    return cells.some((cell) => "rowspan" in cell.attributes || "colspan" in cell.attributes);
  }

  function serializeSafeTable(node) {
    if (node.type === "text") return escapeHtmlText(node.value);
    if (node.type !== "element") return "";
    if (DROP_TAGS.has(node.tag)) return "";
    const inner = (node.children || []).map(serializeSafeTable).join("");
    if (!SAFE_TABLE_TAGS.has(node.tag)) return inner;
    if (node.tag === "br") return "<br>";
    let attributes = "";
    if (node.tag === "th" || node.tag === "td") {
      for (const name of ["rowspan", "colspan"]) {
        const value = node.attributes[name];
        if (value !== undefined && /^[1-9]\d*$/.test(String(value))) attributes += ` ${name}="${value}"`;
      }
    }
    return `<${node.tag}${attributes}>${inner}</${node.tag}>`;
  }

  function markdownTableCell(cell) {
    const inline = inlineMarkdown(cell.children || [])
      .trim()
      .split("\\")
      .join("\\\\")
      .split("|")
      .join("\\|");
    return inline.replace(/(?:\s*\n\s*)+/g, "<br>");
  }

  function tableToMarkdown(table) {
    if (isComplexTable(table)) return `\n\n${serializeSafeTable(table)}\n\n`;
    const rows = findElements(table, "tr")
      .map((row) => (row.children || []).filter((child) => child.type === "element" && (child.tag === "td" || child.tag === "th")))
      .filter((cells) => cells.length > 0);
    if (rows.length === 0) return "";
    const width = rows.reduce((max, cells) => Math.max(max, cells.length), 0);
    const lines = [];
    rows.forEach((cells, index) => {
      const values = [];
      for (let i = 0; i < width; i += 1) values.push(cells[i] ? markdownTableCell(cells[i]) : "");
      lines.push(`| ${values.join(" | ")} |`);
      if (index === 0) lines.push(`| ${new Array(width).fill("---").join(" | ")} |`);
    });
    return `\n\n${lines.join("\n")}\n\n`;
  }

  function inlineMarkdown(nodes) {
    let out = "";
    for (const node of nodes) {
      if (node.type === "text") {
        out += node.value.replace(/\s+/g, " ");
        continue;
      }
      if (node.type !== "element") continue;
      const tag = node.tag;
      if (DROP_TAGS.has(tag)) continue;
      const inner = inlineMarkdown(node.children || []);
      if (tag === "br") out += "\n";
      else if (tag === "strong" || tag === "b") out += `**${inner.trim()}**`;
      else if (tag === "em" || tag === "i") out += `*${inner.trim()}*`;
      else if (tag === "code") out += `\`${inner.trim()}\``;
      else if (tag === "a") {
        const href = node.attributes.href || "";
        out += isSafeMarkdownLink(href) ? `[${inner.trim()}](${href})` : inner;
      } else if (tag === "img") {
        const src = node.attributes.src || "";
        const alt = node.attributes.alt || "";
        out += isSafeMarkdownImage(src) ? `![${alt}](${src})` : alt;
      } else if (tag === "p" || BLOCK_TAGS.has(tag)) out += `\n${blockMarkdown([node])}\n`;
      else out += inner;
    }
    return out;
  }

  function listMarkdown(node, ordered) {
    const items = (node.children || []).filter((child) => child.type === "element" && child.tag === "li");
    return items
      .map((item, index) => {
        const marker = ordered ? `${index + 1}.` : "*";
        const content = blockMarkdown(item.children || []).trim() || inlineMarkdown(item.children || []).trim();
        const [first, ...rest] = content.split("\n");
        const indented = rest.map((line) => (line ? `    ${line}` : line)).join("\n");
        return rest.length > 0 ? `${marker} ${first}\n${indented}` : `${marker} ${first}`;
      })
      .join("\n");
  }

  function blockMarkdown(nodes) {
    const blocks = [];
    let inlineBuffer = [];
    const flushInline = () => {
      if (inlineBuffer.length === 0) return;
      const text = inlineMarkdown(inlineBuffer).replace(/[ \t]+/g, " ").trim();
      if (text) blocks.push(text);
      inlineBuffer = [];
    };

    for (const node of nodes) {
      if (node.type === "text") {
        inlineBuffer.push(node);
        continue;
      }
      if (node.type !== "element") continue;
      const tag = node.tag;
      if (DROP_TAGS.has(tag) || tag === "head" || tag === "title" || tag === "meta" || tag === "link") continue;
      if (/^h[1-6]$/.test(tag)) {
        flushInline();
        const level = Number(tag[1]);
        blocks.push(`${"#".repeat(level)} ${inlineMarkdown(node.children || []).trim()}`);
        continue;
      }
      if (tag === "pre") {
        flushInline();
        const codeNode = (node.children || []).find((child) => child.type === "element" && child.tag === "code");
        const language = codeNode ? String(codeNode.attributes.class || "").replace(/^language-/, "") : "";
        const code = collectText(node).replace(/\n$/, "");
        blocks.push(`\`\`\`${language}\n${code}\n\`\`\``);
        continue;
      }
      if (tag === "table") {
        flushInline();
        const markdown = tableToMarkdown(node).trim();
        if (markdown) blocks.push(markdown);
        continue;
      }
      if (tag === "ul" || tag === "ol") {
        flushInline();
        const markdown = listMarkdown(node, tag === "ol");
        if (markdown) blocks.push(markdown);
        continue;
      }
      if (tag === "blockquote") {
        flushInline();
        const inner = blockMarkdown(node.children || []).trim();
        if (inner) blocks.push(inner.split("\n").map((line) => `> ${line}`).join("\n"));
        continue;
      }
      if (tag === "hr") {
        flushInline();
        blocks.push("---");
        continue;
      }
      if (tag === "br") {
        inlineBuffer.push(node);
        continue;
      }
      if (BLOCK_TAGS.has(tag) || tag === "html" || tag === "body") {
        flushInline();
        const inner = blockMarkdown(node.children || []).trim();
        if (inner) blocks.push(inner);
        continue;
      }
      inlineBuffer.push(node);
    }
    flushInline();
    return blocks.join("\n\n");
  }

  function htmlToMarkdown(html) {
    return blockMarkdown(parseHtml(html).children).replace(/\n{3,}/g, "\n\n").trim();
  }

  function htmlToText(html) {
    const tree = parseHtml(html);
    const markdownish = blockMarkdown(tree.children);
    return markdownish
      .replace(/^#{1,6}\s+/gm, "")
      .replace(/^\*\s+/gm, "- ")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  // ---------- Markdown -> HTML ----------

  function isSafeMarkdownLink(href) {
    const value = String(href || "").trim();
    if (!value) return false;
    // 控制字符会被浏览器忽略，可用来伪装 javascript:；// 开头是协议相对地址（Windows 上还会变成 UNC 路径）
    if (/[\u0000-\u001f\u007f]/.test(value)) return false;
    if (value.startsWith("//")) return false;
    if (/^(?:https?:|mailto:)/i.test(value)) return true;
    return /^(?:#|\/|\.\/|\.\.\/)/.test(value);
  }

  function isSafeMarkdownImage(src) {
    const value = String(src || "").trim();
    if (!value) return false;
    if (/[\u0000-\u001f\u007f\\]/.test(value)) return false;
    if (value.startsWith("//")) return false;
    if (/^data:image\/(png|jpe?g|gif|webp|avif);base64,/i.test(value)) return true;
    return !/^[a-z][a-z\d+.-]*:/i.test(value);
  }

  const MARKDOWN_ESCAPABLE = "\\`*_{}[]()#+-.!>|~";

  // 找强调的收尾定界符：闭合符前面不能是空白（CommonMark 的 right-flanking 近似）
  function findEmphasisEnd(source, start, marker) {
    let index = source.indexOf(marker, start);
    while (index > start) {
      const previous = source[index - 1];
      if (previous && !/\s/.test(previous) && previous !== "\\") return index;
      index = source.indexOf(marker, index + marker.length);
    }
    return -1;
  }

  // 只有附近确实存在 "](" 时才跑链接正则：满屏 "[" 的输入否则会退化成 O(n^2)
  function hasLinkTail(source, index) {
    const close = source.indexOf("](", index + 1);
    return close !== -1 && close - index <= 1024;
  }

  function isWordCharacter(char) {
    return Boolean(char) && /[0-9A-Za-z\u4e00-\u9fff]/.test(char);
  }

  function inlineHtml(text) {
    let out = "";
    let index = 0;
    const source = String(text);
    while (index < source.length) {
      const char = source[index];
      if (char === "\\" && MARKDOWN_ESCAPABLE.includes(source[index + 1] || "")) {
        out += escapeHtmlText(source[index + 1]);
        index += 2;
        continue;
      }
      if (char === "`") {
        const end = source.indexOf("`", index + 1);
        if (end > index) {
          out += `<code>${escapeHtmlText(source.slice(index + 1, end))}</code>`;
          index = end + 1;
          continue;
        }
      }
      if (char === "!" && source[index + 1] === "[" && hasLinkTail(source, index)) {
        const match = /^!\[([^\]]{0,1024})\]\(((?:[^()\s]|\([^()]*\)){0,2048})(?:\s+"([^"]{0,256})")?\)/.exec(source.slice(index));
        if (match) {
          const [full, alt, src, title] = match;
          if (isSafeMarkdownImage(src)) {
            const titleAttribute = title ? ` title="${escapeHtmlAttribute(title)}"` : "";
            out += `<img src="${escapeHtmlAttribute(src)}" alt="${escapeHtmlAttribute(alt)}"${titleAttribute}>`;
          } else {
            out += escapeHtmlText(alt);
          }
          index += full.length;
          continue;
        }
      }
      if (char === "[" && hasLinkTail(source, index)) {
        const match = /^\[([^\]]{0,1024})\]\(((?:[^()\s]|\([^()]*\)){0,2048})(?:\s+"([^"]{0,256})")?\)/.exec(source.slice(index));
        if (match) {
          const [full, label, href, title] = match;
          if (isSafeMarkdownLink(href)) {
            const titleAttribute = title ? ` title="${escapeHtmlAttribute(title)}"` : "";
            out += `<a href="${escapeHtmlAttribute(href)}"${titleAttribute}>${inlineHtml(label)}</a>`;
          } else {
            out += escapeHtmlText(label);
          }
          index += full.length;
          continue;
        }
      }
      if (source.startsWith("**", index) && !/\s/.test(source[index + 2] || " ")) {
        const end = findEmphasisEnd(source, index + 2, "**");
        if (end > index + 1) {
          out += `<strong>${inlineHtml(source.slice(index + 2, end))}</strong>`;
          index = end + 2;
          continue;
        }
      }
      if (char === "*" || char === "_") {
        // 下划线不参与词内强调（snake_case_name 必须原样保留）；星号也要求定界符紧挨非空白
        const intraWord = char === "_" && (isWordCharacter(source[index - 1]) || false);
        if (!intraWord && !/\s/.test(source[index + 1] || " ")) {
          const end = findEmphasisEnd(source, index + 1, char);
          if (end > index + 1 && !(char === "_" && isWordCharacter(source[end + 1]))) {
            out += `<em>${inlineHtml(source.slice(index + 1, end))}</em>`;
            index = end + 1;
            continue;
          }
        }
      }
      out += escapeHtmlText(char);
      index += 1;
    }
    return out;
  }

  // ---------- GFM 表格 ----------

  function splitTableRow(line) {
    const trimmed = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    const cells = [];
    let current = "";
    for (let i = 0; i < trimmed.length; i += 1) {
      const char = trimmed[i];
      if (char === "\\" && (trimmed[i + 1] === "|" || trimmed[i + 1] === "\\")) {
        current += trimmed[i + 1];
        i += 1;
        continue;
      }
      if (char === "|") {
        cells.push(current.trim());
        current = "";
        continue;
      }
      current += char;
    }
    cells.push(current.trim());
    return cells;
  }

  function isTableDelimiterRow(line) {
    const trimmed = String(line || "").trim();
    if (!trimmed.includes("-") || !trimmed.includes("|")) return false;
    return /^\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?$/.test(trimmed);
  }

  function isTableRow(line) {
    return String(line || "").trim().startsWith("|");
  }

  function tableRowsToHtml(rows) {
    const width = rows.reduce((max, row) => Math.max(max, row.length), 0);
    const cell = (value, tag) => `<${tag}>${inlineHtml(String(value == null ? "" : value).split("<br>").join("\n"))
      .split("\n")
      .join("<br>")}</${tag}>`;
    const head = `<thead><tr>${rows[0].concat(new Array(Math.max(0, width - rows[0].length)).fill("")).map((value) => cell(value, "th")).join("")}</tr></thead>`;
    const body = rows
      .slice(1)
      .map((row) => `<tr>${row.concat(new Array(Math.max(0, width - row.length)).fill("")).map((value) => cell(value, "td")).join("")}</tr>`)
      .join("\n");
    return `<table>\n${head}\n<tbody>\n${body}\n</tbody>\n</table>`;
  }

  function markdownBlocksToHtml(markdown) {
    const lines = String(markdown == null ? "" : markdown).replace(/\r\n/g, "\n").split("\n");
    const html = [];
    let paragraph = [];
    let listType = null;
    let listItems = [];
    let codeLines = null;
    let codeLanguage = "";
    let quoteLines = null;

    const flushParagraph = () => {
      if (paragraph.length === 0) return;
      html.push(`<p>${inlineHtml(paragraph.join(" ").trim())}</p>`);
      paragraph = [];
    };
    const flushList = () => {
      if (!listType) return;
      const items = listItems.map((item) => `<li>${inlineHtml(item)}</li>`).join("\n");
      html.push(`<${listType}>\n${items}\n</${listType}>`);
      listType = null;
      listItems = [];
    };
    const flushQuote = () => {
      if (!quoteLines) return;
      html.push(`<blockquote><p>${inlineHtml(quoteLines.join(" ").trim())}</p></blockquote>`);
      quoteLines = null;
    };
    const flushAll = () => {
      flushParagraph();
      flushList();
      flushQuote();
    };

    for (let lineIndex = 0; lineIndex < lines.length; lineIndex += 1) {
      const line = lines[lineIndex];
      // GFM 表格：当前行以 | 开头且下一行是分隔行
      if (!codeLines && isTableRow(line) && isTableDelimiterRow(lines[lineIndex + 1])) {
        flushAll();
        const rows = [splitTableRow(line)];
        let cursor = lineIndex + 2;
        while (cursor < lines.length && isTableRow(lines[cursor])) {
          rows.push(splitTableRow(lines[cursor]));
          cursor += 1;
        }
        html.push(tableRowsToHtml(rows));
        lineIndex = cursor - 1;
        continue;
      }
      const fence = /^```(.*)$/.exec(line.trim());
      if (codeLines) {
        if (fence) {
          html.push(`<pre><code${codeLanguage ? ` class="language-${escapeHtmlAttribute(codeLanguage)}"` : ""}>${escapeHtmlText(codeLines.join("\n"))}\n</code></pre>`);
          codeLines = null;
          codeLanguage = "";
          continue;
        }
        codeLines.push(line);
        continue;
      }
      if (fence) {
        flushAll();
        codeLines = [];
        codeLanguage = fence[1].trim();
        continue;
      }
      if (!line.trim()) {
        flushAll();
        continue;
      }
      const heading = /^(#{1,6})\s+(.*)$/.exec(line);
      if (heading) {

    const categories = new Set(state.items.map((item) => item.category));
    const target = state.target;
    const imageTarget = ["png", "jpg", "webp", "bmp", "ico", "pdf"].includes(target);
    elements.imageOptions.hidden = !(categories.has("image") && imageTarget);
    elements.pdfOptions.hidden = !(categories.has("image") && target === "pdf");
    elements.textOptions.hidden = !(["csv", "tsv", "json", "md", "html", "txt", "epub", "docx"].includes(target)
      && (categories.has("text") || categories.has("table") || categories.has("data")));
    elements.alphaBackgroundField.hidden = !["jpg", "bmp", "pdf"].includes(target);
    elements.ebookTitleField.hidden = target !== "epub" && target !== "docx";
  }

  function renderResults() {
    const finished = state.items.filter((item) => item.status === "success" && item.result);
    const extras = state.extraResults || [];
    const all = finished.map((item) => item.result).concat(extras);
    const nodes = all.map((result, index) => {
      const li = document.createElement("li");
      li.className = "result-item";
      const body = createTextElement("div", "result-body");
      body.append(createTextElement("p", "result-name", result.name));
      body.append(createTextElement("p", "result-meta", formatBytes(result.size)));
      const actions = createTextElement("div", "result-actions");
      const save = createTextElement("button", "ghost-button", t("action.download"));
      save.type = "button";
      save.dataset.download = String(index);
      actions.append(save);
      if (supportsSavePicker()) {
        const saveAs = createTextElement("button", "ghost-button", t("action.saveAs"));
        saveAs.type = "button";
        saveAs.dataset.saveAs = String(index);
        actions.append(saveAs);
      }
      li.append(body, actions);
      return li;
    });
    elements.resultList.replaceChildren(...nodes);
    elements.resultsCounter.textContent = String(all.length);
    elements.resultsCard.hidden = all.length === 0;
    elements.downloadAllButton.hidden = all.length < 2;
    state.allResults = all;
  }

  function refreshLanguage() {
    document.documentElement.lang = i18n.language;
    document.querySelectorAll("[data-i18n]").forEach((element) => {
      element.textContent = t(element.dataset.i18n);
    });
    document.querySelectorAll("[data-i18n-aria]").forEach((element) => {
      element.setAttribute("aria-label", t(element.dataset.i18nAria));
    });
    elements.languageSelect.value = i18n.language;
    elements.themeToggleLabel.textContent = t(`theme.${state.theme}`);
    if (offline.buildInfo) elements.buildLine.textContent = t("footer.build", { version: offline.buildInfo.version });
    renderQueue();
    renderTargets();
    renderResults();
    if (!state.converting) {
      setStatus(state.items.length === 0 ? t("status.idle") : t("status.ready", { count: state.items.length }));
    }
  }

  function makeItem(file) {
    const extension = formatMap.extensionOf(file.name);
    return {
      file,
      name: file.name,
      size: file.size,
      extension,
      category: formatMap.categoryOf(extension),
      status: "pending",
      detail: "",
      result: null,
      thumbnail: "",
    };
  }

  function attachThumbnail(item) {
    if (item.category !== "image" || item.size > 24 * 1024 * 1024) return;
    const url = URL.createObjectURL(item.file);
    state.objectUrls.push(url);
    item.thumbnail = url;
  }

  function addFiles(fileList) {
    if (state.converting) return;
    const files = Array.from(fileList || []).filter((file) => file && file.size >= 0);
    if (files.length === 0) return;
    let rejected = 0;
    for (const file of files) {
      if (file.size > MAX_FILE_BYTES) {
        rejected += 1;
        continue;
      }
      const item = makeItem(file);
      attachThumbnail(item);
      state.items.push(item);
    }
    if (rejected > 0) {
      showToast(t("error.tooLarge", { size: formatBytes(MAX_FILE_BYTES), limit: formatBytes(MAX_FILE_BYTES) }), "error");
    }
    setStageState(state.items.length > 1 ? "batch" : "analyzing");
    renderQueue();
    renderTargets();
    renderResults();
    setStatus(t("status.ready", { count: state.items.length }));
    // 识别动作只是一个短暂的状态；转换开始后由 convertAll 接管，避免把成功/失败状态覆盖掉
    if (mascotTimer) clearTimeout(mascotTimer);
    mascotTimer = window.setTimeout(() => {
      mascotTimer = 0;
      if (!state.converting) setStageState(state.items.length > 1 ? "batch" : "idle");
    }, 500);
  }

  function clearQueue() {
    if (state.converting) return;
    if (mascotTimer) {
      clearTimeout(mascotTimer);
      mascotTimer = 0;
    }
    for (const url of state.objectUrls) URL.revokeObjectURL(url);
    state.objectUrls = [];
    state.items = [];
    state.extraResults = [];
    state.target = "";
    renderQueue();
    renderTargets();
    renderResults();
    setStageState("upload");
    setStatus(t("status.idle"));
    showToast(t("toast.cleared"));
  }

  // 中文 Windows 里 Excel 导出的 CSV / TXT 常见 GBK 编码：UTF-8 解出替换字符时回退 GBK
  async function readFileAsText(file) {
    const buffer = new Uint8Array(await file.arrayBuffer());
    const utf8 = new TextDecoder("utf-8").decode(buffer);
    if (!utf8.includes("\uFFFD")) return utf8;
    try {
      const gbk = new TextDecoder("gbk").decode(buffer);
      if (!gbk.includes("\uFFFD")) return gbk;
    } catch (error) {
      // 浏览器不支持 gbk 时保持 UTF-8 结果
    }
    return utf8;
  }

  function textOptions() {
    const raw = elements.csvDelimiter.value;
    return {
      delimiter: raw === "\\t" ? "\t" : raw,
      bom: elements.csvBom.checked,
      title: elements.ebookTitle.value.trim(),
    };
  }

  function imageOptions() {
    return {
      quality: Number(elements.imageQuality.value) || 88,
      maxSize: Number(elements.imageMaxSize.value) || 0,
      background: elements.alphaBackground.value,
    };
  }

  function toBytes(data) {
    if (data instanceof Uint8Array) return data;
    return new TextEncoder().encode(String(data));
  }

  function makeResult(name, bytes, extension, warnings) {
    const blob = new Blob([bytes], { type: formatMap.mimeTypeFor(extension) });
    return { name, blob, size: blob.size, warnings: warnings || [] };
  }

  // 警告是 { code, messages: { zhCN, enUS } }，与桌面版同结构
  function warningText(warnings) {
    if (!warnings || warnings.length === 0) return "";
    const key = i18n && i18n.language === "en-US" ? "enUS" : "zhCN";
    return warnings.map((warning) => (warning.messages ? warning.messages[key] : warning.code)).join(" ");
  }

  async function convertOne(item, target) {
    if (item.category === "image") {
      const converted = await imageRuntime.convertImage(item.file, target, imageOptions());
      if (converted.canvas && converted.canvas.width * converted.canvas.height > MAX_IMAGE_PIXELS) {
        const error = new Error("image exceeds the 50MP offline limit");
        error.code = "IMAGE_TOO_LARGE";
        throw error;
      }
      if (target === "pdf") {
        const pdf = pdfWriter.createImagePdf([{ data: converted.jpeg }], {
          paper: elements.pdfPaper.value,
          margin: Number(elements.pdfMargin.value) || 0,
        });
        return makeResult(formatMap.outputNameFor(item.name, "pdf"), pdf, "pdf", converted.warnings);
      }
      return makeResult(formatMap.outputNameFor(item.name, target), converted.data, target, converted.warnings);
    }
    const source = item.extension || "txt";
    const raw = await readFileAsText(item.file);
    const options = textOptions();
    if (!options.title) options.title = formatMap.safeBaseName(item.name);
    const converted = await convertText.convertTextDocument(raw, source, target, options);
    return makeResult(formatMap.outputNameFor(item.name, target), toBytes(converted.data), target, converted.warnings);
  }

  async function convertQueueToZip(items) {
    const entries = [];
    const used = new Set();
    for (const item of items) {
      let name = formatMap.sanitizeFileName(item.name) || "file";
      let suffix = 1;
      while (used.has(name)) {
        suffix += 1;
        name = `${formatMap.safeBaseName(item.name)}-${suffix}.${formatMap.extensionOf(item.name) || "bin"}`;
      }
      used.add(name);
      entries.push({ name, data: new Uint8Array(await item.file.arrayBuffer()) });
    }
    const bytes = await zipWriter.createZipCompressed(entries);
    const name = items.length === 1
      ? formatMap.outputNameFor(items[0].name, "zip")
      : `formatdeck-${items.length}-files.zip`;
    return makeResult(name, bytes, "zip");
  }

  async function convertMergedPdf(items) {
    const options = imageOptions();
    const pages = [];
    for (const item of items) {
      const converted = await imageRuntime.convertImage(item.file, "pdf", options);
      pages.push({ data: converted.jpeg });
    }
    const pdf = pdfWriter.createImagePdf(pages, {
      paper: elements.pdfPaper.value,
      margin: Number(elements.pdfMargin.value) || 0,
    });
    return makeResult(formatMap.outputNameFor(items[0].name, "pdf"), pdf, "pdf");
  }

  // 整批失败（打包 / 合并 PDF 这种一次成一个产物的路径）时，把错误落到每个文件上
  function markBatchFailed(items, error) {
    const detail = t("error.convert", { message: error && error.message ? error.message : String(error) });
    for (const item of items) {
      item.status = "error";
      item.result = null;
      item.detail = detail;
    }
  }

  async function convertAll() {
    if (state.converting || state.items.length === 0) return;
    if (!state.target) {
      showToast(t("error.noTarget"), "error");
      return;
    }
    state.converting = true;
    if (mascotTimer) {
      clearTimeout(mascotTimer);
      mascotTimer = 0;
    }
    state.extraResults = [];
    elements.convertButton.disabled = true;
    elements.convertButton.textContent = t("action.converting");
    elements.clearButton.disabled = true;
    elements.addMoreButton.disabled = true;
    setStageState(state.items.length > 1 ? "batch" : "converting");

    const target = state.target;
    const mergePdf = target === "pdf" && elements.pdfMerge.checked && state.items.filter((item) => item.category === "image").length > 1;

    try {
      if (target === "zip") {
        for (const item of state.items) {
          item.status = "converting";
          item.detail = "";
        }
        renderQueue();
        setStatus(t("status.converting", { current: 1, total: 1, name: state.items[0].name }));
        try {
          const result = await convertQueueToZip(state.items);
          for (const item of state.items) {
            item.status = "success";
            item.result = null;
          }
          state.extraResults = [result];
        } catch (error) {
          markBatchFailed(state.items, error);
        }
      } else if (mergePdf) {
        const images = state.items.filter((item) => item.category === "image");
        setStatus(t("status.converting", { current: 1, total: 1, name: images[0].name }));
        for (const item of images) {
          item.status = "converting";
        }
        renderQueue();
        try {
          const result = await convertMergedPdf(images);
          for (const item of images) {
            item.status = "success";
            item.result = null;
          }
          state.extraResults = [result];
          showToast(t("toast.merged", { count: images.length }));
        } catch (error) {
          markBatchFailed(images, error);
        }
      } else {
        let index = 0;
        for (const item of state.items) {
          index += 1;
          item.status = "converting";
          item.detail = "";
          renderQueue();
          setStatus(t("status.converting", { current: index, total: state.items.length, name: item.name }));
          try {
            item.result = await convertOne(item, target);
            item.status = "success";
          } catch (error) {
            item.status = "error";
            item.result = null;
            item.detail = t("error.convert", { message: error && error.message ? error.message : String(error) });
          }
          renderQueue();
        }
      }
    } finally {
      state.converting = false;
      elements.clearButton.disabled = false;
      elements.addMoreButton.disabled = false;
      elements.convertButton.textContent = t("action.convert");
      elements.convertButton.disabled = state.items.length === 0 || !state.target;
    }

    const failed = state.items.filter((item) => item.status === "error").length;
    const success = state.items.length - failed;
    if (failed === 0) {
      setStageState("success");
      setStatus(t("status.done", { count: success }), "success");
    } else if (success === 0) {
      setStageState("error");
      setStatus(t("status.failedAll"), "error");
    } else {
      setStageState("error");
      setStatus(t("status.partial", { success, failed }), "error");
    }

    renderQueue();
    renderResults();
  }

  function downloadWithAnchor(name, blob) {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function supportsSavePicker() {
    return typeof window.showSaveFilePicker === "function";
  }

  // 「另存为」走文件选择器：可以自己选目录，也不会被浏览器改名（部分环境会丢掉 download 属性里的中文名）。
  async function saveBlobAs(name, blob) {
    if (!supportsSavePicker()) {
      downloadWithAnchor(name, blob);
      return;
    }
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: name });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
    } catch (error) {
      if (error && error.name === "AbortError") return;
      downloadWithAnchor(name, blob);
    }
  }

  function saveBlob(name, blob) {
    downloadWithAnchor(name, blob);
  }

  // 同名结果（不同目录的同名文件）必须改名，否则 ZIP 里会出现重复条目，解压时互相覆盖
  function uniqueName(name, used) {
    if (!used.has(name)) {
      used.add(name);
      return name;
    }
    const dot = name.lastIndexOf(".");
    const stem = dot > 0 ? name.slice(0, dot) : name;
    const extension = dot > 0 ? name.slice(dot) : "";
    let suffix = 2;
    let candidate = `${stem}-${suffix}${extension}`;
    while (used.has(candidate)) {
      suffix += 1;
      candidate = `${stem}-${suffix}${extension}`;
    }
    used.add(candidate);
    return candidate;
  }

  async function downloadAll() {
    const results = state.allResults || [];
    if (results.length === 0) return;
    try {
      const used = new Set();
      const entries = [];
      for (const result of results) {
        entries.push({ name: uniqueName(result.name, used), data: new Uint8Array(await result.blob.arrayBuffer()) });
      }
      const bytes = await zipWriter.createZipCompressed(entries);
      saveBlob("formatdeck-offline.zip", new Blob([bytes], { type: "application/zip" }));
    } catch (error) {
      showToast(t("error.convert", { message: error && error.message ? error.message : String(error) }), "error");
    }
  }

  // 与桌面版一致：用户手动选择目标格式时按源扩展名记忆，下次同类文件默认这个目标
  function rememberTarget() {
    if (!preferencesModule || !state.target || state.items.length === 0) return;
    state.preferences = preferencesModule.rememberTarget(
      state.preferences,
      state.items.map((item) => item.extension),
      state.target,
    );
    try {
      const storage = safeStorage();
      if (storage) storage.setItem(preferencesModule.STORAGE_KEY, JSON.stringify(state.preferences));
    } catch (error) {
      // 隐私模式下存不了偏好，不影响转换
    }
  }

  function moveItem(index, direction) {
    if (state.converting) return;
    const target = direction === "up" ? index - 1 : index + 1;
    if (target < 0 || target >= state.items.length) return;
    const [item] = state.items.splice(index, 1);
    state.items.splice(target, 0, item);
    renderQueue();
  }

  function removeItem(index) {
    if (state.converting) return;
    const [removed] = state.items.splice(index, 1);
    if (removed && removed.thumbnail) {
      URL.revokeObjectURL(removed.thumbnail);
      state.objectUrls = state.objectUrls.filter((url) => url !== removed.thumbnail);
    }
    renderQueue();
    renderTargets();
    renderResults();
    if (state.items.length === 0) {
      setStageState("upload");
      setStatus(t("status.idle"));
    }
  }

  function bindEvents() {
    elements.dropZone.addEventListener("click", () => elements.fileInput.click());
    elements.addMoreButton.addEventListener("click", () => elements.fileInput.click());
    elements.fileInput.addEventListener("change", () => {
      addFiles(elements.fileInput.files);
      elements.fileInput.value = "";
    });
    elements.clearButton.addEventListener("click", clearQueue);
    elements.convertButton.addEventListener("click", convertAll);
    elements.downloadAllButton.addEventListener("click", downloadAll);

    ["dragenter", "dragover"].forEach((type) => {
      elements.dropZone.addEventListener(type, (event) => {
        event.preventDefault();
        elements.dropZone.classList.add("dragging");
        setStageState("upload");
      });
    });
    ["dragleave", "dragend"].forEach((type) => {
      elements.dropZone.addEventListener(type, () => elements.dropZone.classList.remove("dragging"));
    });
    elements.dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      elements.dropZone.classList.remove("dragging");
      addFiles(event.dataTransfer ? event.dataTransfer.files : null);
    });
    document.addEventListener("dragover", (event) => event.preventDefault());
    document.addEventListener("drop", (event) => event.preventDefault());
    document.addEventListener("paste", (event) => {
      const files = event.clipboardData ? Array.from(event.clipboardData.files || []) : [];
      if (files.length > 0) addFiles(files);
    });

    elements.targetGroup.addEventListener("click", (event) => {
      const chip = event.target.closest("[data-target]");
      if (!chip) return;
      state.target = chip.dataset.target;
      rememberTarget();
      renderTargets();
    });

    elements.queueList.addEventListener("click", (event) => {
      const move = event.target.closest("[data-move]");
      if (move) {
        moveItem(Number(move.dataset.move), move.dataset.direction);
        return;
      }
      const remove = event.target.closest("[data-remove]");
      if (remove) removeItem(Number(remove.dataset.remove));
    });

    elements.resultList.addEventListener("click", (event) => {
      const saveAsButton = event.target.closest("[data-save-as]");
      if (saveAsButton) {
        const target = (state.allResults || [])[Number(saveAsButton.dataset.saveAs)];
        if (target) saveBlobAs(target.name, target.blob);
        return;
      }
      const button = event.target.closest("[data-download]");
      if (!button) return;
      const result = (state.allResults || [])[Number(button.dataset.download)];
      if (result) saveBlob(result.name, result.blob);
    });

    elements.imageQuality.addEventListener("input", () => {
      elements.imageQualityValue.textContent = elements.imageQuality.value;
    });

    elements.themeToggle.addEventListener("click", () => {
      const next = THEME_ORDER[(THEME_ORDER.indexOf(state.theme) + 1) % THEME_ORDER.length];
      applyTheme(next);
    });

    elements.languageSelect.addEventListener("change", () => {
      i18n.setLanguage(elements.languageSelect.value);
      refreshLanguage();
    });
  }

  function collectElements() {
    const ids = [
      "stageArt", "stageGlyph", "dropZone", "fileInput", "workbench", "queueList", "queueCounter", "queueEmpty",
      "addMoreButton", "clearButton", "targetGroup", "targetNote", "imageOptions", "pdfOptions", "textOptions",
      "imageQuality", "imageQualityValue", "imageMaxSize", "alphaBackground", "alphaBackgroundField", "pdfPaper",
      "pdfMargin", "pdfMerge", "csvDelimiter", "csvBom", "ebookTitle", "ebookTitleField", "convertButton",
      "statusLine", "resultsCard", "resultList", "resultsCounter", "downloadAllButton", "themeToggle",
      "themeToggleLabel", "languageSelect", "toast", "buildLine",
    ];
    for (const id of ids) elements[id] = byId(id);
  }

  function initialize() {
    collectElements();
    const storage = safeStorage();
    i18n = i18nModule.createI18n({
      storage,
      systemLanguage: navigator.language,
      messages,
    });
    if (preferencesModule) state.preferences = preferencesModule.readPreferences(storage);
    applyTheme(readStoredTheme());
    setStageState("upload");
    bindEvents();
    refreshLanguage();
    renderResults();
    if (offline.buildInfo) {
      elements.buildLine.textContent = t("footer.build", { version: offline.buildInfo.version });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize);
  else initialize();
})(typeof globalThis !== "undefined" ? globalThis : this);

    </script>
  </body>
</html>
